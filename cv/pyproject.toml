[project]
name = "aerovision-worker"
version = "0.1.0"
description = "AeroVision CV worker"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "pandas>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "torch>=2.5,<3.0",
    "ultralytics>=8.3,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
aerovision-worker = "aerovision_worker.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
